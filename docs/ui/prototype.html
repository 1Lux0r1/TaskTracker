<title>Прототип TaskTracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#eff4fd;
    --surface:#ffffff;
    --surface-2:#eaf1fc;
    --ink:#0e141b;
    --ink-2:#556472;
    --ink-3:#8b98a5;
    --hair:#dfe7f3;
    --hair-2:#c6d3e6;
    --brand:#2b5fe8;
    --brand-soft:#e4ecff;
    --copper:#e8730f;
    --copper-soft:#ffeeda;
    --good:#0b8f66;
    --good-soft:#dcf6ec;
    --warn:#b8740c;
    --warn-soft:#fdf0d8;
    --bad:#cf3f36;
    --bad-soft:#ffe6e3;
    --c1:#3b6fd6; --c2:#12916b; --c3:#cf7a08; --c4:#a8449f; --c4-soft:#f7e6f5;
    --seq1:#dce7f8; --seq2:#a8c2ee; --seq3:#5e8bdb; --seq4:#2a4f9e;
    --r:14px; --r-sm:9px;
    --shadow:0 10px 30px rgba(14,20,27,.12), 0 2px 6px rgba(14,20,27,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0f1318; --surface:#181d24; --surface-2:#1f262e;
      --ink:#e9eef3; --ink-2:#a3b0bd; --ink-3:#77838f;
      --hair:#28303a; --hair-2:#38424e;
      --brand:#7fa9ff; --brand-soft:#1b2a49;
      --copper:#ff9d4d; --copper-soft:#3a2617;
      --good:#4fc09c; --good-soft:#12302a;
      --warn:#d7a04a; --warn-soft:#31271a;
      --bad:#e08272; --bad-soft:#35201d;
      --c1:#5b8ae8; --c2:#2aa87d; --c3:#cb830f; --c4:#c05cb8; --c4-soft:#33203a;
      --seq1:#22344b; --seq2:#31547f; --seq3:#4e7cc0; --seq4:#8fb4f5;
      --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0f1318; --surface:#181d24; --surface-2:#1f262e;
    --ink:#e9eef3; --ink-2:#a3b0bd; --ink-3:#77838f;
    --hair:#28303a; --hair-2:#38424e;
    --brand:#7fa9ff; --brand-soft:#1b2a49;
    --copper:#ff9d4d; --copper-soft:#3a2617;
    --good:#4fc09c; --good-soft:#12302a;
    --warn:#d7a04a; --warn-soft:#31271a;
    --bad:#e08272; --bad-soft:#35201d;
    --c1:#5b8ae8; --c2:#2aa87d; --c3:#cb830f; --c4:#c05cb8; --c4-soft:#33203a;
    --seq1:#22344b; --seq2:#31547f; --seq3:#4e7cc0; --seq4:#8fb4f5;
    --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:"Manrope",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
  h1{font-size:25px;font-weight:700;line-height:1.2}
  h2{font-size:18px;font-weight:600}
  h3{font-size:15.5px;font-weight:600}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .muted{color:var(--ink-2)}
  .dim{color:var(--ink-3)}

  /* ---------- оболочка ---------- */
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100%}
  .rail{
    background:var(--surface);border-right:1px solid var(--hair);
    padding:20px 14px 28px;display:flex;flex-direction:column;gap:22px;
    position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto;
  }
  .logo{display:flex;align-items:center;gap:9px;padding:0 6px}
  .logo i{
    width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;
    color:#fff;font-family:"Manrope";font-weight:700;font-size:13px;font-style:normal;flex:none;
  }
  :root[data-theme="dark"] .logo i{color:#0f1318}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo i{color:#0f1318}}
  .logo b{font-family:"Manrope";font-weight:700;font-size:16px;letter-spacing:-.02em}
  .proj-switch{
    border:1px solid var(--hair);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface-2);cursor:pointer;
  }
  .proj-switch b{display:block;font-family:"Manrope";font-size:13.5px;font-weight:600;line-height:1.25}
  .proj-switch span{font-size:11.5px;color:var(--ink-3)}
  .navgrp{display:flex;flex-direction:column;gap:2px}
  .navgrp .cap{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:0 8px 6px;font-weight:600}
  .navgrp button{
    all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;
    color:var(--ink-2);font-size:14px;
  }
  .navgrp button:hover{background:var(--surface-2);color:var(--ink)}
  .navgrp button[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .navgrp button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .navgrp .ico{width:17px;text-align:center;font-size:14px;opacity:.85;flex:none}
  .navgrp .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
  .navgrp .n.hot{color:var(--bad);font-weight:600}

  .col{display:flex;flex-direction:column;min-width:0}
  .topbar{
    position:sticky;top:0;z-index:12;background:color-mix(in srgb, var(--ground) 86%, transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);
    padding:10px 26px;display:flex;align-items:center;gap:14px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
  }
  .omni{
    flex:1;max-width:520px;display:flex;align-items:center;gap:9px;cursor:text;
    background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:7px 12px;color:var(--ink-3);font-size:14px;
  }
  .omni:hover{border-color:var(--hair-2)}
  .omni kbd{
    margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--hair);
    border-radius:5px;padding:1px 5px;color:var(--ink-3);background:var(--surface-2);
  }
  .me{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2)}

  main{padding:24px 26px 56px;max-width:1240px;width:100%}
  .phead{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
  .phead p{margin:5px 0 0;color:var(--ink-2);font-size:14px;max-width:62ch}
  .pacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  @media (max-width:560px){
    .pacts{width:100%}
    .pacts .seg{width:100%}
    .pacts .seg button{flex:1}
    .pacts > .btn{flex:1}
  }

  /* ---------- элементы ---------- */
  .btn{
    all:unset;cursor:pointer;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:9px;
    border:1px solid var(--hair-2);color:var(--ink);background:var(--surface);white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2)}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  :root[data-theme="dark"] .btn.primary{color:#0f1318}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1318}}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
  .btn.danger{color:var(--bad);border-color:var(--bad)}

  .seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
  .seg button{all:unset;cursor:pointer;padding:5px 13px;border-radius:7px;font-size:13.5px;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(14,20,27,.08)}
  .seg button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}

  .filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .fchip{
    all:unset;cursor:pointer;font-size:13px;padding:5px 12px;border-radius:99px;
    border:1px solid var(--hair);color:var(--ink-2);background:var(--surface);
  }
  .fchip:hover{border-color:var(--hair-2);color:var(--ink)}
  .fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:500}
  .fchip:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .fchip .b{opacity:.6;margin-left:5px;font-family:"IBM Plex Mono",monospace;font-size:11.5px}

  .card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:18px}
  .card h3{margin-bottom:3px}
  .card .sub{font-size:13px;color:var(--ink-3);margin-bottom:14px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 9px;border-radius:99px;white-space:nowrap;font-weight:500}
  .pill i{width:6px;height:6px;border-radius:50%;display:block;flex:none;background:currentColor}
  .p-neutral{background:var(--surface-2);color:var(--ink-2)}
  .p-brand{background:var(--brand-soft);color:var(--brand)}
  .p-good{background:var(--good-soft);color:var(--good)}
  .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-copper{background:var(--copper-soft);color:var(--copper)}

  .ava{
    width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:10.5px;font-weight:600;background:var(--brand-soft);color:var(--brand);
    font-family:"Manrope";letter-spacing:.02em;
  }
  .ava.sm{width:21px;height:21px;font-size:9px}
  .who{display:inline-flex;align-items:center;gap:7px;font-size:13.5px}

  /* строки-списки вместо таблиц */
  .list{display:flex;flex-direction:column}
  .li{
    display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--hair);
    cursor:pointer;background:var(--surface);
  }
  .li:first-child{border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
  .li:last-child{border-bottom:0;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
  .li:hover{background:var(--surface-2)}
  .li .main{min-width:0;flex:1}
  .li .t{font-size:14.5px;line-height:1.35;display:block;overflow:hidden;text-overflow:ellipsis}
  .li .m{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .li .rt{display:flex;align-items:center;gap:10px;flex:none}
  .listbox.cols .li{position:relative}
  .listbox.cols .li .rt{display:grid;grid-template-columns:170px 128px 80px;align-items:center;gap:10px;text-align:left}
  .listbox.cols .li .rt > *{justify-self:start}
  .listbox.cols .li .rt .due{justify-self:end}
  .listbox.cols .li .rowact{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    background:var(--brand-soft);padding:4px 0 4px 12px;border-radius:9px}
  @media (max-width:900px){ .listbox.cols .li .rt{display:flex} }
  .li.done .t{color:var(--ink-3);text-decoration:line-through}
  .listbox{border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;background:var(--surface)}
  .rowact{display:flex;gap:5px;opacity:0}
  .li:hover .rowact{opacity:1}

  .due{font-size:13px;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
  .due.over{color:var(--bad);font-weight:500}
  .due.soon{color:var(--warn);font-weight:500}
  .due.none{color:var(--ink-3)}

  /* доска */
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:272px;gap:14px;overflow-x:auto;padding-bottom:8px}
  .bcol{background:var(--surface-2);border-radius:var(--r);padding:11px}
  .bcol h4{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;
    align-items:center;margin-bottom:11px;padding:0 4px;font-family:"Manrope"}
  .bcol h4 span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
  .tcard{
    background:var(--surface);border:1px solid var(--hair);border-radius:11px;padding:12px;margin-bottom:8px;
    cursor:pointer;display:flex;flex-direction:column;gap:9px;
  }
  .tcard:hover{border-color:var(--hair-2)}
  .tcard .t{font-size:14px;line-height:1.35}
  .tcard .f{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tcard.hot{border-left:3px solid var(--bad)}

  /* почта */
  .inbox{display:grid;grid-template-columns:minmax(300px,1fr) 1.25fr;gap:14px;align-items:start}
  .mailist{border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;background:var(--surface);max-height:640px;overflow-y:auto}
  .mail{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--hair);cursor:pointer}
  .mail:last-child{border-bottom:0}
  .mail:hover{background:var(--surface-2)}
  .mail[aria-current="true"]{background:var(--brand-soft)}
  .mail .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:7px;background:transparent}
  .mail.unread .dot{background:var(--copper)}
  .mail .body{min-width:0;flex:1}
  .mail .from{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3)}
  .mail .subj{font-size:14px;margin:2px 0;line-height:1.3}
  .mail.unread .subj{font-weight:600}
  .mail .snip{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reader{border:1px solid var(--hair);border-radius:var(--r);background:var(--surface);padding:20px}
  .reader .rh{border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:14px}
  .reader .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink-2);margin-top:10px}
  .reader .meta b{color:var(--ink);font-weight:500}
  .thread{display:flex;flex-direction:column;gap:0;margin-top:6px}
  .tev{display:flex;gap:11px;padding:9px 0}
  .tev .line{display:flex;flex-direction:column;align-items:center;flex:none}
  .tev .line i{width:9px;height:9px;border-radius:50%;background:var(--hair-2);display:block;margin-top:5px}
  .tev.now .line i{background:var(--brand)}
  .tev .line span{flex:1;width:1px;background:var(--hair);margin:4px 0 -9px}
  .tev:last-child .line span{display:none}
  .tev .txt{font-size:13.5px}
  .tev .txt em{font-style:normal;color:var(--ink-3);font-size:12.5px;display:block;margin-top:1px}

  /* воронка документов */
  .pipe{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;padding-bottom:8px}
  .pcol{background:var(--surface-2);border-radius:var(--r);padding:11px;min-height:120px}
  .pcol h4{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:10px;display:flex;
    justify-content:space-between;font-family:"Manrope"}
  .dcard{background:var(--surface);border:1px solid var(--hair);border-radius:11px;padding:12px;margin-bottom:8px;cursor:pointer}
  .dcard:hover{border-color:var(--hair-2)}
  .dcard .cp{font-size:14px;font-weight:600;font-family:"Manrope";line-height:1.3}
  .dcard .kind{font-size:12px;color:var(--ink-3);margin-top:1px}
  .dcard .sigs{display:flex;align-items:center;gap:7px;margin-top:10px}
  .ring{width:30px;height:30px;flex:none}
  .dcard .waiting{font-size:12.5px;color:var(--ink-2);margin-top:9px;display:flex;gap:6px;align-items:flex-start}
  .sigdots{display:flex;gap:4px}
  .sigdots i{width:8px;height:8px;border-radius:50%;display:block;background:var(--hair-2)}
  .sigdots i.ok{background:var(--good)} .sigdots i.no{background:var(--bad)}

  /* календарь */
  .cal{border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;background:var(--surface)}
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--hair)}
  .calhead div{padding:9px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .calbody{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cday{min-height:108px;padding:8px 9px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
    display:flex;flex-direction:column;gap:4px}
  .cday:nth-child(7n){border-right:0}
  .cday.out{background:var(--surface-2)}
  .cday .d{font-size:12.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
  .cday.today .d{background:var(--brand);color:#fff;border-radius:6px;padding:1px 6px;align-self:flex-start;font-weight:600}
  :root[data-theme="dark"] .cday.today .d{color:#0f1318}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cday.today .d{color:#0f1318}}
  .ev{font-size:11.5px;padding:3px 7px;border-radius:6px;cursor:pointer;display:flex;gap:5px;align-items:center;
    background:var(--surface-2);color:var(--ink-2);line-height:1.25}
  .ev:hover{color:var(--ink)}
  .ev i{width:6px;height:6px;border-radius:2px;flex:none}
  .ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.over{background:var(--bad-soft);color:var(--bad)}

  /* цифры и графики */
  .kpi{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:16px 18px}
  .kpi b{display:block;font-family:"Manrope";font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.03em}
  .kpi span{font-size:13px;color:var(--ink-2);display:block;margin-top:5px}
  .kpi em{font-style:normal;font-size:12px;color:var(--ink-3);display:block;margin-top:2px}
  .kpi b{color:var(--brand)}
  .legend{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:12px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px;display:block}
  figure{margin:0}
  figcaption{font-size:12.5px;color:var(--ink-3);margin-top:10px}
  svg{max-width:100%;display:block}
  svg text{font-family:"Source Sans 3",sans-serif}
  .tip{position:fixed;z-index:50;background:var(--ink);color:var(--ground);font-size:12px;padding:5px 9px;
    border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}

  /* отчёт */
  .doc{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;max-width:820px}
  .doc .s{padding:18px 22px;border-bottom:1px solid var(--hair)}
  .doc .s:last-child{border-bottom:0}
  .doc .s h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
    display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .doc .s p,.doc .s ul{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.55}
  .doc .s ul{padding-left:19px}
  .doc .s li{margin-bottom:5px}
  .doc .s b{color:var(--ink);font-weight:600}

  /* формы и панель */
  .scrim{position:fixed;inset:0;background:rgba(10,15,20,.4);z-index:30;backdrop-filter:blur(2px)}
  .sheet{
    position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);
    border-left:1px solid var(--hair);box-shadow:var(--shadow);z-index:31;overflow-y:auto;
    padding:22px 24px calc(28px + env(safe-area-inset-bottom,0px));
  }
  .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
  .props{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
  .prop{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
  .prop.wide{grid-column:1 / -1}
  .bar{display:block;height:6px;border-radius:99px;background:var(--hair);overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
  .prop > span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
  .prop > div{font-size:14px;color:var(--ink)}
  .mrow{display:block;padding:13px 18px;border-top:1px solid var(--hair);cursor:pointer}
  .mrow:first-of-type{border-top:0}
  .mrow:hover{background:var(--brand-soft)}
  .mrow .mt{font-size:14.5px;line-height:1.35;display:block}
  .mrow .mm{font-size:12.5px;color:var(--ink-3);margin-top:4px;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
  .mrow .mm .mono{color:var(--ink-2)}
  .mrow .mp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .blk{margin-bottom:18px}
  .blk h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px;font-weight:600}
  .blk h4::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;
    background:var(--brand);margin-right:8px;vertical-align:1px}
  .blk p{margin:0;font-size:14px;color:var(--ink-2)}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .field input,.field select,.field textarea{
    font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--hair-2);border-radius:9px;
    background:var(--surface);color:var(--ink);width:100%;
  }
  .field select[multiple]{padding:0;height:auto}
  .field select[multiple] option{padding:5px 10px}
  .field .hint{margin:0}
  .field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:2px solid var(--brand);outline-offset:0}
  .field .err{font-size:12.5px;color:var(--bad)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--hair)}

  /* командная строка */
  /* акценты поярче */
  .logo i{background:linear-gradient(135deg,var(--brand) 0%,#7b5cf0 100%)!important}
  .btn.primary{background:linear-gradient(135deg,var(--brand) 0%,#4f7ef5 100%);border-color:transparent}
  .kpi{position:relative;overflow:hidden;--acc:var(--brand);--acc-soft:var(--brand-soft);
    border-radius:var(--r);transition:transform .16s ease,box-shadow .16s ease}
  .kpi::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(135deg,var(--acc-soft) 0%,transparent 62%);opacity:.85}
  .kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc)}
  .kpi > *{position:relative}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(16,32,64,.4)}
  .kpi.bad{--acc:var(--bad);--acc-soft:var(--bad-soft)}
  .kpi.warn{--acc:var(--copper);--acc-soft:var(--copper-soft)}
  .kpi.good{--acc:var(--good);--acc-soft:var(--good-soft)}
  .kpi b{color:var(--acc)}
  .card h3{color:var(--ink)}
  .card{position:relative;overflow:hidden;--acc:var(--brand);--acc-soft:var(--brand-soft)}
  .card.t-copper{--acc:var(--copper);--acc-soft:var(--copper-soft)}
  .card.t-good{--acc:var(--good);--acc-soft:var(--good-soft)}
  .card.t-bad{--acc:var(--bad);--acc-soft:var(--bad-soft)}
  .card.t-violet{--acc:var(--c4);--acc-soft:var(--c4-soft)}
  .card.acc::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc)}
  .chead{display:flex;align-items:flex-start;gap:11px;margin-bottom:14px}
  .chead .ic{width:30px;height:30px;border-radius:9px;background:var(--acc-soft);color:var(--acc);flex:none;
    display:flex;align-items:center;justify-content:center}
  .chead .ic svg{width:16px;height:16px}
  .chead h3{margin:0 0 2px}
  .chead .sub{margin:0;font-size:13px;color:var(--ink-3)}
  .chead .act{margin-left:auto;flex:none}
  .card.acc > .chead{padding-top:2px}

  /* строка поиска и фильтров */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .search{flex:1;min-width:220px;max-width:420px;position:relative;display:flex;align-items:center}
  .search span{position:absolute;left:13px;color:var(--ink-3);font-size:14px}
  .search input{width:100%;font:inherit;font-size:14px;padding:9px 14px 9px 34px;border:1px solid var(--hair);
    border-radius:11px;background:var(--surface);color:var(--ink)}
  .search input:focus-visible{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
  .fbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;
    border:1px solid var(--hair);background:var(--surface);font-size:14px;color:var(--ink-2)}
  .fbtn:hover{border-color:var(--hair-2);color:var(--ink)}
  .fbtn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:500}
  .fbtn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .fbtn .n{background:var(--brand);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;font-family:"IBM Plex Mono",monospace}
  .found{margin-left:auto;font-size:13px;color:var(--ink-3)}

  /* плитки разделов */
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
  .stat{position:relative;overflow:hidden;cursor:pointer;border-radius:var(--r);padding:16px 18px 15px;
    background:var(--surface);border:1px solid var(--hair);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
  .stat::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(135deg,var(--acc-soft) 0%,transparent 62%);opacity:.9}
  .stat::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc)}
  .stat > *{position:relative}
  .stat:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(16,32,64,.45);border-color:var(--acc)}
  .stat:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .stat.s-task{--acc:var(--brand);--acc-soft:var(--brand-soft)}
  .stat.s-letter{--acc:var(--copper);--acc-soft:var(--copper-soft)}
  .stat.s-meet{--acc:var(--c4);--acc-soft:var(--c4-soft)}
  .stat .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .stat .ic{width:32px;height:32px;border-radius:10px;background:var(--acc);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center}
  :root[data-theme="dark"] .stat .ic{color:#0f1318}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat .ic{color:#0f1318}}
  .stat .ic svg{width:17px;height:17px}
  .stat .lbl{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .stat .go{margin-left:auto;font-size:16px;color:var(--ink-3);transition:transform .16s ease,color .16s ease}
  .stat:hover .go{color:var(--acc);transform:translateX(3px)}
  .stat .sn{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .stat .sn b{font-family:"Manrope";font-size:38px;font-weight:800;line-height:1;letter-spacing:-.035em;color:var(--acc)}
  .stat .chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;
    background:var(--surface);border:1px solid var(--hair);color:var(--ink-3);white-space:nowrap}
  .stat .chip.on{background:var(--acc);border-color:transparent;color:#fff}
  :root[data-theme="dark"] .stat .chip.on{color:#0f1318}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat .chip.on{color:#0f1318}}
  .stat .sbar{display:flex;gap:3px;height:6px;margin:14px 0 9px}
  .stat .sbar i{border-radius:99px;min-width:6px;background:var(--acc);transition:width .2s ease}
  .stat .sbar i.r{background:var(--bad)}
  .stat .sbar i.m{background:var(--hair)}
  .stat .sfoot{font-size:12.5px;color:var(--ink-3)}
  .stat .sfoot b{font-weight:600;color:var(--ink-2)}
  .stat .sfoot b.r{color:var(--bad)}
  @media (max-width:860px){ .stats{grid-template-columns:1fr} }

  /* план работы */
  .wtree{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
  .prow{display:grid;grid-template-columns:26px 74px minmax(0,1fr) 58px 148px 132px;align-items:center;gap:10px;
    padding:9px 16px;border-top:1px solid var(--hair);cursor:pointer}
  .prow:first-child{border-top:0}
  .prow:hover{background:var(--brand-soft)}
  .prow.l1{background:var(--surface-2);padding:13px 16px}
  .prow.l1:hover{background:var(--brand-soft)}
  .prow.l1 .wn{font-family:"Manrope";font-size:15px;font-weight:700;letter-spacing:-.01em}
  .prow.l2 .wn{font-weight:600}
  .prow.l3 .wc{padding-left:12px}
  .prow.l4 .wc{padding-left:24px}
  .prow.l4 .wn,.prow.l4 .wc{color:var(--ink-2)}
  .prow .tw{display:flex;justify-content:center}
  .prow .twist{width:22px;height:22px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
    border-radius:6px;font-size:11px;line-height:1}
  .prow .twist:hover{background:var(--hair);color:var(--ink)}
  .prow .dot{width:7px;height:7px;border-radius:2px;display:block}
  .prow .wc{font-size:12px;color:var(--ink-3)}
  .prow .wn{font-size:14px;min-width:0}
  .prow .wn em{display:block;font-style:normal;font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .prow .wn em.warn{color:var(--copper)}
  .prow .ms{color:var(--copper);margin-left:7px;font-size:11px}
  .prow .wp{display:flex;align-items:center;gap:8px;min-width:0}
  .prow .wd{font-size:12.5px;color:var(--ink-3);justify-self:end;white-space:nowrap}
  .prow .wd.over{color:var(--bad)}
  .prow.late .wn{font-weight:600}
  .role{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;
    background:var(--brand-soft);color:var(--brand)}
  .pbar{flex:1;min-width:34px;height:6px;border-radius:99px;background:var(--hair);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--c2);border-radius:99px}
  .pn{font-size:12px;color:var(--ink-3)}
  @media (max-width:1100px){
    .prow{grid-template-columns:26px minmax(0,1fr) auto;row-gap:4px}
    .prow .wc{grid-column:2;font-size:11px}
    .prow .wn{grid-column:2}
    .prow .ww,.prow .wp,.prow .wd{grid-column:3;justify-self:end}
  }

  /* сетевой график */
  .netwrap{position:relative;padding:8px 12px}
  .nsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  .nedge{fill:none;stroke:var(--hair-2);stroke-width:1.6}
  .nedge.crit{stroke:var(--copper);stroke-width:2.2}
  .nband{position:absolute;left:8px;right:12px;border-radius:12px;background:var(--surface-2);opacity:.75}
  .nband.alt{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
  .nband span{position:absolute;left:16px;top:12px;width:150px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1.3;
    color:var(--ink-3);font-weight:600}
  .nnode{position:absolute;background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--ink-3);
    border-radius:10px;padding:8px 11px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
    box-shadow:0 1px 2px rgba(16,32,64,.05);transition:transform .14s ease,box-shadow .14s ease}
  .nnode:hover{transform:translateY(-2px);box-shadow:0 10px 22px -14px rgba(16,32,64,.5)}
  .nnode:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .nnode.s-DONE{border-left-color:var(--c2)}
  .nnode.s-WIP{border-left-color:var(--c1)}
  .nnode.s-NOT{border-left-color:var(--hair-2)}
  .nnode.s-FAIL{border-left-color:var(--bad)}
  .nnode.crit{border-color:var(--copper)}
  .nnode .nc{font-size:11px;color:var(--ink-3);flex:none;display:flex;align-items:center;gap:5px}
  .nnode .nt{font-size:13px;font-weight:600;line-height:1.3;flex:none;min-height:34px;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .nnode .nm{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);margin-top:auto;flex:none}
  .nnode .nbar{height:4px;border-radius:99px;background:var(--hair);overflow:hidden;flex:none}
  .nnode .nbar i{display:block;height:100%;background:var(--c2)}

  /* таймлайн плана */
  .thead{display:flex;border-bottom:1px solid var(--hair);background:var(--surface-2)}
  .thead .tl{width:300px;flex:none;padding:10px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .thead .tt{flex:1;display:flex}
  .thead .tt > div{border-left:1px solid var(--hair);padding:10px 8px;font-size:11.5px;color:var(--ink-3);
    text-align:center;text-transform:capitalize;min-width:0;overflow:hidden}
  .tbody{position:relative}
  .tbody.now::after{content:"";position:absolute;top:0;bottom:0;left:calc(300px + (100% - 300px) * var(--today, 0));
    width:2px;background:var(--copper);opacity:.55}
  .trow{display:flex;align-items:center;border-top:1px solid var(--hair);cursor:pointer;min-height:42px}
  .trow:first-child{border-top:0}
  .trow:hover{background:var(--brand-soft)}
  .trow.top{background:var(--surface-2);font-weight:600}
  .trow.top:hover{background:var(--brand-soft)}
  .trow .tl{width:300px;flex:none;padding:8px 14px;font-size:13.5px;display:flex;gap:9px;align-items:baseline;min-width:0}
  .trow .tl .mono{font-size:11.5px;color:var(--ink-3);flex:none}
  .trow .tt{flex:1;position:relative;height:30px}
  .tbar{position:absolute;top:5px;height:20px;border-radius:6px;background:var(--hair-2);overflow:hidden;
    display:flex;align-items:center;min-width:6px}
  .tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c2);opacity:.85}
  .tbar b{position:relative;font-size:10.5px;color:#fff;font-weight:600;padding:0 7px;white-space:nowrap}
  .tbar.s-WIP{background:var(--c1)} .tbar.s-DONE{background:var(--c2)}
  .tbar.s-NOT{background:var(--hair-2)} .tbar.s-FAIL{background:var(--bad)}
  .tbar.s-NOT b{color:var(--ink-2)}
  .tms{position:absolute;top:4px;color:var(--copper);font-size:14px;line-height:22px}
  @media (max-width:900px){
    .thead .tl,.trow .tl{width:170px}
    .tbody.now::after{left:calc(170px + (100% - 170px) * var(--today, 0))}
  }

  /* реестр */
  .reg{border:1px solid var(--hair);border-radius:var(--r);background:var(--surface);overflow:hidden}
  .reghead,.regrow{display:grid;grid-template-columns:110px 50px minmax(0,1fr) 156px 116px 84px 152px;
    gap:12px;align-items:center;padding:11px 16px}
  .reghead{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    background:var(--surface-2);font-weight:600}
  .regrow{border-top:1px solid var(--hair);cursor:pointer;font-size:13.5px}
  .regrow:hover{background:var(--brand-soft)}
  .regrow .subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .regrow.act .subj{font-weight:600}
  .regrow .cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .dirmark{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:7px;
    font-size:12px;font-weight:600}
  .dirmark.in{background:var(--brand-soft);color:var(--brand)}
  .dirmark.out{background:var(--copper-soft);color:var(--copper)}
  @media (max-width:1150px){
    .reghead{display:none}
    .regrow{grid-template-columns:1fr auto;gap:5px 10px;padding:12px 14px}
  }

  .reg.docs .reghead,.reg.docs .regrow{grid-template-columns:minmax(0,1fr) 116px 158px 104px 118px 88px 152px}
  .reg.reps .reghead,.reg.reps .regrow{grid-template-columns:186px 176px minmax(0,1fr) 154px 190px minmax(0,1fr)}
  @media (max-width:1150px){ .reg.reps .regrow{grid-template-columns:1fr} }
  .g2f{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:900px){ .g2f{grid-template-columns:1fr} }
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  @media (max-width:1240px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:620px){ .g4{grid-template-columns:1fr} }
  .grid.top{align-items:start}
  @media (max-width:1150px){ .reg.docs .regrow{grid-template-columns:1fr auto} }

  /* календарь */
  .calwrap{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:14px;align-items:start}
  @media (max-width:1080px){ .calwrap{grid-template-columns:1fr} }
  .cday{cursor:pointer}
  .cday.sel{box-shadow:inset 0 0 0 2px var(--brand)}
  .cday .more{font-size:11px;color:var(--ink-3);padding-left:4px}
  .ev{background:var(--surface-2)}
  .ev:hover{background:var(--brand-soft);color:var(--brand)}
  .wrows{display:flex;flex-direction:column;gap:9px}
  .wrow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:center;cursor:pointer;
        background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:12px 14px}
  .wrow:hover{border-color:var(--brand-2)}
  .wrow.sel{box-shadow:inset 0 0 0 2px var(--brand)}
  .wrow.today .wd b{background:var(--brand);color:#fff;border-radius:7px;padding:1px 8px}
  :root[data-theme="dark"] .wrow.today .wd b{color:#0f1318}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wrow.today .wd b{color:#0f1318}}
  .wrow.wknd{background:var(--surface-2)}
  .wrow .wd b{font-family:"Manrope";font-size:16px;display:inline-block}
  .wrow .wd span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
  .wrow .wi{display:flex;flex-wrap:wrap;gap:7px;min-width:0}
  .wrow .ev{font-size:12.5px;padding:5px 10px;max-width:100%}
  .wrow .ev span{white-space:normal}
  .wrow .wempty{font-size:12.5px;color:var(--ink-3)}
  .agenda .ahead{display:flex;align-items:baseline;gap:10px;padding:14px 18px 6px;font-size:12.5px;color:var(--ink-3)}
  .agenda .ahead b{font-family:"Manrope";font-size:15px;color:var(--ink)}
  .agenda .ahead .tdy{color:var(--brand);font-weight:600}
  .daypanel .dh{padding:16px 18px 10px;border-bottom:1px solid var(--hair)}
  .daypanel .dh b{font-family:"Manrope";font-size:16px;display:block}
  .daypanel .dh span{font-size:12.5px;color:var(--ink-3)}

  /* календарь с длительностью */
  .calweeks{display:flex;flex-direction:column}
  .cweek{border-bottom:1px solid var(--hair)}
  .cweek:last-child{border-bottom:0}
  .cdays{display:grid;grid-template-columns:repeat(7,1fr)}
  .cdays > div{padding:8px 10px 2px;border-right:1px solid var(--hair);font-size:12.5px;color:var(--ink-3);
    font-family:"IBM Plex Mono",monospace}
  .cdays > div:last-child{border-right:0}
  .cdays > div.out{background:var(--surface-2)}
  .cdays > div.today span{background:var(--brand);color:#fff;border-radius:6px;padding:1px 6px;font-weight:600}
  .cbars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;padding:2px 0 10px;min-height:20px}
  .cbar{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink);padding:4px 9px;border-radius:7px;
    cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin:0 3px;
    background:var(--surface-2);border:1px solid var(--hair);border-left-width:3px}
  .cbar:hover{border-color:var(--brand-2);border-left-color:currentColor}
  .cbar.k-task{border-left-color:var(--c1)}
  .cbar.k-letter{border-left-color:var(--c3)}

  function esc(v){ return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function counts(k){
    if(k === "tasks") return state.tasks.filter(function(t){ return !taskDone(t); }).length;
    if(k === "letters") return state.letters.filter(needsUs).length;
    if(k === "docs") return state.docs.filter(function(d){ return !docClosed(d) && d.st !== "DECLINED"; }).length;
    return "";
  }
  function hot(k){ return k === "letters"; }

  function renderNav(){
    function grp(items, cap){
      return (cap ? '<div class="cap">' + cap + '</div>' : "") + items.map(function(i){
        var n = counts(i.k);
        return '<button type="button" data-go="' + i.k + '" aria-current="' + (route === i.k) + '">' +
          '<span class="ico" aria-hidden="true">' + i.ico + '</span>' + i.label +
          (n ? '<span class="n' + (hot(i.k) ? " hot" : "") + '">' + n + '</span>' : "") + '</button>';
      }).join("");
    }
    document.getElementById("nav1").innerHTML = grp(NAV_MAIN, "Работа");
    document.getElementById("nav2").innerHTML = grp(NAV_SEC, "Сводка");
  }

  var ICONS = {

    task:'<path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10"/>'

  function ico(name){
    return '<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg></span>';
  }
  function cardHead(icon, title, sub, act){
    return '<div class="chead">' + ico(icon) + '<div><h3>' + title + '</h3>' +
      (sub ? '<div class="sub">' + sub + '</div>' : "") + '</div>' +
      (act ? '<div class="act">' + act + '</div>' : "") + '</div>';
  }

    var SICON = {
    tasks: '<path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10"/>',
    letters: '<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/>',
    meetings: '<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>'
  };
  function stat(cfg){
    var tot = 0;
    cfg.segs.forEach(function(x){ tot += x.n; });
    var bar = tot ? cfg.segs.filter(function(x){ return x.n > 0; }).map(function(x){
      return '<i class="' + (x.c || "") + '" style="width:' + (x.n / tot * 100).toFixed(1) + '%"></i>';
    }).join("") : '<i class="m" style="width:100%"></i>';
    return '<div class="stat s-' + cfg.tone + '" data-go="' + cfg.go + '" role="button" tabindex="0" ' +
      'aria-label="' + esc(cfg.label + ": " + cfg.total) + '">' +
      '<div class="sh"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + SICON[cfg.icon || cfg.go] + '</svg></span>' +
      '<span class="lbl">' + cfg.label + '</span>' +
      '<span class="go" aria-hidden="true">→</span></div>' +
      '<div class="sn"><b>' + cfg.total + '</b>' +
      '<span class="chip' + (cfg.fresh ? " on" : "") + '">' + (cfg.fresh ? cfg.freshWord : cfg.emptyWord) + '</span></div>' +
      '<div class="sbar" aria-hidden="true">' + bar + '</div>' +
      '<div class="sfoot">' + cfg.foot + '</div></div>';
  }

  /* ---------- экран «Сегодня» ---------- */
  function screenToday(){
    var overdue = state.tasks.filter(function(t){ return !taskDone(t) && t.due && days(t.due) < 0; });
    var week = state.tasks.filter(function(t){ return !taskDone(t) && t.due && days(t.due) >= 0 && days(t.due) <= 7; });
    var needAnswer = state.letters.filter(needsUs);
    var signOnUs = state.docs.filter(function(d){ return !docClosed(d) && d.st !== "DECLINED"; });
    var meets = state.meetings.filter(function(m){ return m.date >= "2026-09-22"; })
      .sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    var newTasks = state.tasks.filter(function(t){ return t.st === "NEW"; });
    var newMail = state.letters.filter(function(l){ return l.st === "NEW"; });

    function block(tone, icon, title, sub, items, go){
      return '<div class="card acc t-' + tone + '">' + cardHead(icon, title, sub) +
        (items.length ? '<div class="list" style="margin:0 -18px">' + items.slice(0,3).join("") + '</div>'
                      : '<p class="dim" style="margin:0;font-size:14px">Ничего не требует внимания.</p>') +
        (items.length > 3 ? '<button class="btn ghost sm" style="margin-top:12px" type="button" data-go="' + go + '">Ещё ' + (items.length - 3) + '</button>' : "") +
        '</div>';
    }
    function tline(t){
      return '<div class="li" data-open="task:' + t.id + '"><div class="main"><span class="t">' + esc(t.title) + '</span>' +
        '<span class="m">' + esc(TRACKS[t.track] || t.track) + ' · ' + esc(t.who) + '</span></div>' +
        '<div class="rt">' + dueTag(t.due, false, true) + '</div></div>';
    }
    function lline(l){
      return '<div class="li" data-open="letter:' + l.id + '"><div class="main"><span class="t">' + esc(l.subject) + '</span>' +
        '<span class="m">' + esc(l.org) + ' · ' + (l.owner ? esc(l.owner) : "ответственный не назначен") + '</span></div>' +
        '<div class="rt">' + dueTag(l.due, false, true) + '</div></div>';
    }
    function dline(d){
      return '<div class="li" data-open="doc:' + d.id + '"><div class="main"><span class="t">' + esc(d.name) + '</span>' +
        '<span class="m">' + esc(DKIND[d.kind]) + ' · ' + esc(docWaiting(d) || "все стороны подписали") + '</span></div>' +
        '<div class="rt">' + dueTag(d.due, false, true) + '</div></div>';
    }
    function mline(m){
      return '<div class="li" data-open="meet:' + m.id + '"><div class="main"><span class="t">' + esc(m.title) + '</span>' +
        '<span class="m">' + esc(m.place) + ' · ' + esc(m.people.join(", ")) + '</span></div>' +
        '<div class="rt"><span class="due mono">' + fmt(m.date) + ' ' + esc(m.time) + '</span></div></div>';
    }

    var head = '<div class="phead"><div><h1>Доброе утро, ' + esc(meFirst()) + '</h1>' +
      '<p>Вторник, 22 сентября. ' + plural(overdue.length, ["задача просрочена","задачи просрочены","задач просрочено"]) + ', ' +
      plural(needAnswer.length, ["письмо ждёт","письма ждут","писем ждут"]) + ' ответа.</p></div>' +
      '<button class="btn primary" type="button" data-new="task">Новая задача</button></div>';

    var inWork = state.tasks.filter(function(t){ return t.st === "IN_PROGRESS"; });
    var doneT = state.tasks.filter(taskDone);
    var lateMail = state.letters.filter(function(l){ return !letterDone(l) && l.due && days(l.due) < 0; });
    var openMail = state.letters.filter(function(l){ return !letterDone(l); });
    var nextMeet = meets[0];
    var stats = '<div class="stats">' +
      stat({ go:"tasks", tone:"task", label:"Задачи", total:state.tasks.length,
        fresh:newTasks.length, freshWord:"новых: " + newTasks.length, emptyWord:"новых нет",
        segs:[{n:overdue.length, c:"r"}, {n:state.tasks.length - overdue.length - doneT.length},
              {n:doneT.length, c:"m"}],
        foot:'в работе <b>' + inWork.length + '</b> · просрочено <b class="r">' + overdue.length +
             '</b> · готово <b>' + doneT.length + '</b>' }) +
      stat({ go:"letters", tone:"letter", label:"Письма ЭДО", total:state.letters.length,
        fresh:newMail.length, freshWord:"новых: " + newMail.length, emptyWord:"новых нет",
        segs:[{n:lateMail.length, c:"r"}, {n:openMail.length - lateMail.length},
              {n:state.letters.length - openMail.length, c:"m"}],
        foot:'ждут ответа <b>' + needAnswer.length + '</b> · просрочено <b class="r">' + lateMail.length +
             '</b> · закрыто <b>' + (state.letters.length - openMail.length) + '</b>' }) +
      stat({ go:"meetings", tone:"meet", label:"Встречи", total:state.meetings.length,
        fresh:meets.length, freshWord:"впереди: " + meets.length, emptyWord:"впереди нет",
        segs:[{n:meets.length}, {n:state.meetings.length - meets.length, c:"m"}],
        foot:nextMeet ? 'ближайшая <b>' + fmt(nextMeet.date) + ", " + esc(nextMeet.time) + '</b> · ' + esc(nextMeet.place)
                      : "все встречи прошли" }) +
      '</div>';

    var cards = [
      block("bad", "alert", "Просрочено", "Требует решения в первую очередь", overdue.map(tline), "tasks"),
      block("copper", "mail", "Письма без ответа", "Мяч на нашей стороне", needAnswer.map(lline), "letters"),
      block("good", "pen", "Документы на подписании", "Видно, чьей подписи не хватает", signOnUs.map(dline), "docs"),
      block("violet", "calendar", "Ближайшие встречи", "Повестка и участники в карточке", meets.map(mline), "meetings")
    ];

    return head + stats + '<div class="grid g2f">' + cards.join("") + '</div>' +
      '<p class="hint" style="margin:16px 0 0">Сюда же выводятся настраиваемые дашборды — состав и настройка в бэклоге.</p>';
  }
  function kpi(v, label, sub, cls){
    return '<div class="kpi ' + cls + '"><b>' + v + '</b><span>' + label + '</span><em>' + sub + '</em></div>';
  }
  function sigDone(){ return state.docs.filter(docClosed).length; }

  /* ---------- задачи ---------- */
  function taskFacetCount(){
    var n = 0;
    ["track","st","who","prio","term"].forEach(function(k){ if(taskFacets[k]) n++; });
    if(taskFacets.mine) n++;
    return n;
  }
  function taskMatch(t){
    if(!taskQuery) return true;
    var hay = norm(t.title + " " + t.who + " " + (t.jira || "") + " " + (TRACKS[t.track] || "") +
                   " " + (t.arts || []).map(function(a){ return a.v; }).join(" "));
    return norm(taskQuery).split(/\s+/).filter(Boolean).every(function(w){ return hay.indexOf(w) !== -1; });
  }
  function visibleTasks(){
    var f = taskFacets;
    return state.tasks.filter(function(t){
      if(f.track && t.track !== f.track) return false;
      if(f.st && t.st !== f.st) return false;
      if(f.who && t.who !== f.who) return false;
      if(f.prio && t.prio !== f.prio) return false;
      if(f.mine && t.who !== ME) return false;
      if(f.term === "over" && !(!taskDone(t) && t.due && days(t.due) < 0)) return false;
      if(f.term === "week" && !(t.due && days(t.due) >= 0 && days(t.due) <= 7)) return false;
      if(f.term === "none" && t.due) return false;
      if(f.term === "open" && taskDone(t)) return false;
      return taskMatch(t);
    });
  }
  function taskFacetBar(){
    function sel(id, label, opts){
      return '<div class="field"><label for="tf_' + id + '">' + label + '</label><select id="tf_' + id + '" data-tfacet="' + id + '">' +
        opts.map(function(o){ return '<option value="' + esc(o[0]) + '"' + (taskFacets[id] === o[0] ? " selected" : "") + '>' + esc(o[1]) + '</option>'; }).join("") +
        '</select></div>';
    }
    return '<div class="facetbar">' +
      sel("track", "Трек", [["","Любой"]].concat(state.tracks.map(function(t){ return [t.k, t.label]; }))) +
      sel("st", "Статус", [["","Любой"]].concat(Object.keys(TSTATUS).map(function(k){ return [k, TSTATUS[k].label]; }))) +
      sel("who", "Ответственный", [["","Любой"]].concat(state.members.map(function(m){ return [m.name, m.name]; }))) +
      sel("prio", "Приоритет", [["","Любой"]].concat(Object.keys(PRIO).map(function(k){ return [k, PRIO[k]]; }))) +
      sel("term", "Срок", [["","Любой"],["over","Просрочен"],["week","Ближайшая неделя"],["none","Не задан"],["open","Только незакрытые"]]) +
      '<div class="acts"><label class="chk" style="padding:0"><input type="checkbox" data-tmine' + (taskFacets.mine ? " checked" : "") + '>' +
      '<span><b>Только мои</b></span></label></div>' +
      '<div class="acts"><button class="btn sm" type="button" data-treset>Сбросить</button>' +
      '<button class="btn sm" type="button" data-act="Набор фильтров сохранён">Сохранить набор</button></div></div>';
  }
  function screenTasks(){
    var rows = visibleTasks();
    var head = '<div class="phead"><div><h1>Задачи</h1>' +
      '<p>Четыре трека в одном месте: производственный идёт в Jira и виден здесь ссылкой, остальные ведутся тут.</p></div>' +
      '<div class="pacts">' +
      '<div class="seg">' + ["board","list","timeline"].map(function(v){
        return '<button type="button" data-tview="' + v + '" aria-pressed="' + (taskView === v) + '">' +
          (v === "board" ? "Доска" : v === "list" ? "Список" : "Сроки") + '</button>'; }).join("") + '</div>' +
      '<button class="btn primary" type="button" data-new="task">Новая задача</button></div></div>';

    var bar = '<div class="toolbar">' +
      '<label class="search"><span aria-hidden="true">⌕</span>' +
      '<input id="tq" type="search" placeholder="Поиск по названию, исполнителю, Jira" value="' + esc(taskQuery) + '" aria-label="Поиск по задачам"></label>' +
      '<button class="fbtn" type="button" data-tpanel aria-pressed="' + taskPanel + '">Фильтры' +
      (taskFacetCount() ? '<span class="n">' + taskFacetCount() + '</span>' : "") + '</button>' +
      '<span class="found">Найдено: ' + rows.length + ' из ' + state.tasks.length + '</span></div>' +
      (taskPanel ? taskFacetBar() : "");

    if(!rows.length) return head + bar + '<div class="listbox"><div class="empty">Под условия ничего не подошло. Сбросьте фильтры или измените запрос.</div></div>';
    if(taskView === "board") return head + bar + taskBoard(rows);
    if(taskView === "list") return head + bar + taskList(rows);
    return head + bar + taskTimeline(rows);
  }
  function taskBoard(rows){
    return '<div class="board">' + Object.keys(TSTATUS).map(function(k){
      var items = rows.filter(function(t){ return t.st === k; });
      return '<div class="bcol"><h4>' + TSTATUS[k].label + '<span>' + items.length + '</span></h4>' +
        items.map(function(t){
          var over = !taskDone(t) && t.due && days(t.due) < 0;
          return '<div class="tcard' + (over ? " hot" : "") + '" data-open="task:' + t.id + '" tabindex="0" role="button">' +
            '<span class="t">' + esc(t.title) + '</span>' +
            (t.jira ? '<span class="pill p-neutral"><i></i>' + esc(t.jira) + '</span>' : "") +
            ((t.files || []).length ? '<span class="pill p-neutral"><i></i>' + t.files.length + ' файл</span>' : "") +
            '<div class="f">' + who(t.who) + dueTag(t.due, taskDone(t)) + '</div></div>';
        }).join("") +
        (items.length ? "" : '<p class="dim" style="font-size:13px;margin:4px 4px 8px">Пусто</p>') + '</div>';
    }).join("") + '</div>';
  }
  function taskList(rows){
    if(!rows.length) return '<div class="listbox"><div class="empty">Под фильтр ничего не подошло.</div></div>';
    return '<div class="listbox cols"><div class="list">' + rows.map(function(t){
      return '<div class="li' + (taskDone(t) ? " done" : "") + '" data-open="task:' + t.id + '">' +
        '<div class="main"><span class="t">' + esc(t.title) + '</span>' +
        '<span class="m">' + esc(TRACKS[t.track]) + (t.jira ? ' · ' + esc(t.jira) : "") +
        (t.prio === "CRITICAL" || t.prio === "HIGH" ? ' · <span style="color:var(--bad)">' + PRIO[t.prio] + '</span>' : "") + '</span></div>' +
        '<div class="rt">' + who(t.who) + pill(TSTATUS[t.st].label, TSTATUS[t.st].tone) + dueTag(t.due, taskDone(t)) +
        '<span class="rowact"><button class="btn sm" type="button" data-open="task:' + t.id + '">Открыть</button>' +
        '<button class="btn sm danger" type="button" data-del="task:' + t.id + '">Удалить</button></span></div></div>';
    }).join("") + '</div></div>';
  }
  function taskTimeline(rows){
    var T0 = new Date(2026,6,1), T1 = new Date(2026,11,1), SPAN = T1 - T0;
    var todayPct = ((TODAY - T0)/SPAN*100).toFixed(2);
    var items = rows.filter(function(t){ return t.due; });
    if(!items.length) return '<div class="listbox"><div class="empty">Ни у одной задачи в выборке нет срока.</div></div>';
    return '<div class="card"><div class="legend">' +
      '<span><i style="background:var(--c1)"></i>В работе</span>' +
      '<span><i style="background:var(--c2)"></i>Готово</span>' +
      '<span><i style="background:var(--bad)"></i>Просрочено</span>' +
      '<span><i style="background:var(--copper);width:3px;height:12px;border-radius:1px"></i>Сегодня</span></div>' +
      '<div style="overflow-x:auto"><div style="min-width:640px">' +
      '<div style="display:grid;grid-template-columns:repeat(5,1fr);font-size:11.5px;color:var(--ink-3);' +
      'text-transform:uppercase;letter-spacing:.06em;padding-left:240px;margin-bottom:8px">' +
      ["Июль","Август","Сентябрь","Октябрь","Ноябрь"].map(function(m){ return "<span>" + m + "</span>"; }).join("") + '</div>' +
      items.map(function(t){
        var s = parse(t.created), d = parse(t.due);
        if(s < T0) s = T0;
        var left = (s - T0)/SPAN*100, width = Math.max((d - s)/SPAN*100, 1.2);
        var color = taskDone(t) ? "var(--c2)" : (days(t.due) < 0 ? "var(--bad)" : "var(--c1)");
        return '<div style="display:grid;grid-template-columns:240px 1fr;align-items:center;gap:12px;padding:5px 0" ' +
          'data-open="task:' + t.id + '">' +
          '<span style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" title="' + esc(t.title) + '">' + esc(t.title) + '</span>' +
          '<div style="position:relative;height:22px">' +
          '<span style="position:absolute;top:6px;left:' + left.toFixed(2) + '%;width:' + width.toFixed(2) + '%;height:10px;' +
          'border-radius:5px;background:' + color + ';cursor:pointer"></span>' +
          '<span style="position:absolute;top:0;bottom:0;left:' + todayPct + '%;width:2px;background:var(--copper)"></span>' +
          '</div></div>';
      }).join("") + '</div></div></div>';
  }

  /* ---------- переписка ---------- */
  var MAIL_FILTERS = [
    {k:"needsUs", label:"Ждут нашего ответа", f:needsUs},
    {k:"waitThem", label:"Ждём ответа на наше", f:function(l){ return !letterDone(l) && l.dir === "out"; }},
    {k:"overdue", label:"Просроченные", f:function(l){ return !letterDone(l) && l.due && days(l.due) < 0; }},
    {k:"noOwner", label:"Без ответственного", f:function(l){ return !letterDone(l) && !l.owner; }},

  /* ---------- документы ---------- */

  /* ---------- календарь ---------- */
  var MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

  function events(){

  var calView = "month", calSel = "2026-09-22", calSpan = false;

  function monthGrid(evs){

  function monthSpans(evs){
    var first = new Date(calY, calM, 1), shift = (first.getDay() + 6) % 7;
    var start = new Date(calY, calM, 1 - shift), weeks = "";
    for(var w = 0; w < 6; w++){
      var wStart = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7);
      var wEnd = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate() + 6);
      if(w === 5 && wStart.getMonth() !== calM) break;
      var cells = "";
      for(var i = 0; i < 7; i++){
        var day = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate() + i);
        cells += '<div class="' + (day.getMonth() !== calM ? "out" : "") +
          (day.getTime() === TODAY.getTime() ? " today" : "") + '" data-calday="' + iso(day) + '"><span>' + day.getDate() + '</span></div>';
      }
      var items = evs.filter(function(e){ return parse(e.to) >= wStart && parse(e.from) <= wEnd; })
        .sort(function(a, b){ return parse(a.from) - parse(b.from); });

          'style="grid-column:' + (a + 1) + ' / ' + (b + 2) + ';grid-row:' + (lane + 1) + '" ' +
          'title="' + esc(EVK[e.kind].one + ": " + e.title) + '"><i></i>' + esc(e.title) + '</span>';
      });
      if(hidden) bars += '<span class="cbar" style="grid-column:1 / 8;grid-row:' + (MAXL + 1) +
        ';background:var(--surface-2);color:var(--ink-3)">ещё ' + hidden + '</span>';
      weeks += '<div class="cweek"><div class="cdays">' + cells + '</div><div class="cbars">' + (bars || '<span></span>') + '</div></div>';

      EVK[e.kind].tok + ')"></span> ' + esc(EVK[e.kind].one) + (e.meta ? ' · ' + esc(e.meta) : "") + '</span></div>' +

                                   : '<span class="mono dim" style="font-size:12.5px">' + fmt(e.to) + '</span>') +

  function agenda(evs){
    var late = evs.filter(function(e){ return e.over; })
      .sort(function(a, b){ return a.to < b.to ? -1 : a.to > b.to ? 1 : 0; });
    var rows = evs.filter(function(e){ return e.to >= "2026-09-22"; })
      .sort(function(a, b){ return a.to < b.to ? -1 : a.to > b.to ? 1 : 0; });
    if(!rows.length && !late.length) return '<div class="listbox"><div class="empty">Впереди пусто.</div></div>';
    var out = '', cur = "";
    if(late.length){
      out += '<div class="ahead"><b>Просрочено</b><span>' + plural(late.length, ["запись","записи","записей"]) + '</span></div>';
      late.forEach(function(e){ out += agendaRow(e); });

    rows.forEach(function(e){
      if(e.to !== cur){

  function dayPanel(evs){

      (list.length ? '<div class="list">' + list.map(function(e){

          '<span class="m"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--' +
          EVK[e.kind].tok + ')"></span> ' + esc(EVK[e.kind].one) + (e.meta ? ' · ' + esc(e.meta) : "") + '</span></div>' +
          '<div class="rt">' + (e.over ? '<span class="due over">просрочено</span>' : "") + '</div></div>';

  function calPeriod(){

  function screenCalendar(){

      '<p>Сроки задач, писем и документов, встречи и вехи плана в одном месте. Слева период, справа — выбранный день целиком: что назначено и что можно завести.</p></div>' +
      '<div class="pacts">' +
      '<div class="seg">' + [["month","Месяц"],["week","Неделя"],["list","Список"]].map(function(v){
        return '<button type="button" data-calview="' + v[0] + '" aria-pressed="' + (calView === v[0]) + '">' + v[1] + '</button>';
      }).join("") + '</div>' + nav + '</div></div>';

        '<span style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;background:var(--' + EVK[k].tok + ')"></span>' +
        EVK[k].label + '<span class="b">' + n + '</span></button>'; }).join("") +
      (calView === "month" ? '<span style="flex:1"></span>' +
        '<button class="fchip" type="button" data-calspan aria-pressed="' + calSpan + '">Показать длительность задач</button>' : "") +
      '</div>';

    if(calView === "list") return head + chips + agenda(evs);
    var grid = calView === "week" ? weekRows(evs) : (calSpan ? monthSpans(evs) : monthGrid(evs));
    return head + chips + '<div class="calwrap">' + grid + dayPanel(evs) + '</div>';
  }

  /* ---------- план работы ---------- */
  var WSTATUS = {
    NOT:{label:"Не приступали", tone:"p-neutral", tok:"--hair-2"},
    WIP:{label:"В работе", tone:"p-brand", tok:"--c1"},
    DONE:{label:"Выполнено", tone:"p-good", tok:"--c2"},
    FAIL:{label:"Выполнено неудачно", tone:"p-bad", tok:"--bad"},
    SKIP:{label:"Не требуется", tone:"p-neutral", tok:"--hair-2"}
  };
  var WLANES = [["org","Организация работ"],["data","Данные"],["store","Хранение и обработка"],["use","Использование данных"]];
  var WROLES = {"РП":"Руководитель проекта", "БА":"Блок аналитики", "БР":"Блок разработки",
                "Арх":"Архитектор", "ГА":"Геоаналитик", "ЮР":"Юридический трек"};
  var planView = "tree", planOpen = {}, planWho = "", planSt = "";
  function laneName(k){
    var r = "";
    WLANES.forEach(function(l){ if(l[0] === k) r = l[1]; });
    return r;
  }
  function byCode(code){
    var r = null;
    state.plan.forEach(function(w){ if(w.code === code) r = w; });
    return r;
  }
  function kids(w){
    return state.plan.filter(function(x){
      return x.lvl === w.lvl + 1 && x.code.indexOf(w.code + ".") === 0;
    });
  }
  function subtree(w){
    return state.plan.filter(function(x){ return x !== w && x.code.indexOf(w.code + ".") === 0; });
  }
  function wProgress(w){
    var leaves = subtree(w).filter(function(x){ return !kids(x).length; });
    if(!leaves.length) leaves = [w];
    var done = leaves.filter(function(x){ return x.st === "DONE" || x.st === "SKIP"; }).length;
    return {done:done, total:leaves.length, pct:Math.round(done / leaves.length * 100)};
  }
  function wSpan(w){
    var k = subtree(w), f = w.from, t = w.to;
    k.forEach(function(x){ if(x.from && x.from < f) f = x.from; if(x.to && x.to > t) t = x.to; });
    return {from:f, to:t};
  }
  function wLate(w){
    if(w.st === "DONE" || w.st === "SKIP") return false;
    var t = wSpan(w).to;
    return !!t && days(t) < 0;
  }
  function wMatch(w){
    if(planWho && w.who !== planWho) return false;
    if(planSt && w.st !== planSt) return false;
    return true;
  }
  function planRows(){
    var out = [];
    state.plan.forEach(function(w){
      if(w.lvl > 1){
        var parent = byCode(w.code.slice(0, w.code.lastIndexOf(".")));
        var up = w, hidden = false;
        while(up && up.lvl > 1){
          up = byCode(up.code.slice(0, up.code.lastIndexOf(".")));
          if(up && !planOpen[up.code]) hidden = true;
        }
        if(hidden) return;
      }
      out.push(w);
    });
    if(!planWho && !planSt) return out;
    return state.plan.filter(wMatch);
  }
  function planTree(){
    var rows = planRows();
    if(!rows.length) return '<div class="listbox"><div class="empty">Под фильтр ничего не подошло.</div></div>';
    return '<div class="wtree">' + rows.map(function(w){
      var k = kids(w), pr = wProgress(w), open = !!planOpen[w.code];
      return '<div class="prow l' + w.lvl + (wLate(w) ? " late" : "") + '" data-open="work:' + w.id + '">' +
        '<span class="tw">' + (k.length
          ? '<button class="twist" type="button" data-wtog="' + esc(w.code) + '" aria-expanded="' + open + '" ' +
            'aria-label="' + (open ? "Свернуть" : "Развернуть") + '">' + (open ? "▾" : "▸") + '</button>'
          : '<i class="dot" style="background:var(' + WSTATUS[w.st].tok + ')"></i>') + '</span>' +
        '<span class="wc mono">' + esc(w.code) + '</span>' +
        '<span class="wn">' + esc(w.title) +
        (w.ms ? '<span class="ms" title="Веха">◆</span>' : "") +
        (w.result ? '<em>' + esc(w.result) + '</em>' : "") +
        (w.note ? '<em class="warn">' + esc(w.note) + '</em>' : "") + '</span>' +
        '<span class="ww">' + (w.who ? '<span class="role" title="' + esc(WROLES[w.who] || w.who) + '">' + esc(w.who) + '</span>' : "") + '</span>' +
        '<span class="wp">' + (k.length
          ? '<span class="pbar" title="' + pr.done + ' из ' + pr.total + '"><i style="width:' + pr.pct + '%"></i></span>' +
            '<span class="pn mono">' + pr.pct + '%</span>'

        (function(){ var sp = wSpan(w);
          return '<span class="wd mono' + (wLate(w) ? " over" : "") + '">' + fmt(sp.from) + " — " + fmt(sp.to) + '</span>'; })() + '</div>';
    }).join("") + '</div>';
  }

  /* сетевой график */
  function netNodes(){ return state.plan.filter(function(w){ return w.net; }); }
  function netDepth(w, memo){
    if(memo[w.code] !== undefined) return memo[w.code];
    var d = 0;
    (w.deps || []).forEach(function(c){
      var p = byCode(c);
      if(p && p.net) d = Math.max(d, netDepth(p, memo) + 1);
    });
    memo[w.code] = d;
    return d;
  }
  function netCritical(nodes){
    var best = {}, prev = {};
    nodes.forEach(function(w){
      var len = dayDiff(parse(w.from), parse(w.to)) + 1, b = 0, p = null;
      (w.deps || []).forEach(function(c){
        var q = byCode(c);
        if(q && q.net && best[q.code] > b){ b = best[q.code]; p = q.code; }
      });
      best[w.code] = b + len;
      prev[w.code] = p;
    });
    var end = null;
    nodes.forEach(function(w){ if(!end || best[w.code] > best[end]) end = w.code; });
    var path = {}, cur = end;
    while(cur){ path[cur] = true; cur = prev[cur]; }
    return path;
  }
  function netGraph(){
    var nodes = netNodes();
    if(!nodes.length) return '<div class="listbox"><div class="empty">В плане ещё нет работ для сетевого графика.</div></div>';
    var memo = {}, crit = netCritical(nodes);
    var W = 216, H = 98, GX = 52, GY = 20, PADT = 34, PADL = 188;
    var lanes = {}, maxCol = 0;
    WLANES.forEach(function(l){ lanes[l[0]] = []; });
    nodes.forEach(function(w){
      var c = netDepth(w, memo);
      maxCol = Math.max(maxCol, c);
      lanes[w.lane].push({w:w, col:c});
    });
    var pos = {}, y = PADT, bands = "";
    WLANES.forEach(function(l, li){
      var items = lanes[l[0]];
      if(!items.length) return;
      var slots = {}, rows = 1;
      items.forEach(function(it){
        slots[it.col] = (slots[it.col] || 0);
        it.row = slots[it.col]++;
        rows = Math.max(rows, slots[it.col]);
      });
      var bandH = rows * H + (rows - 1) * GY + 26;
      bands += '<div class="nband' + (li % 2 ? " alt" : "") + '" style="top:' + (y - 13) + 'px;height:' + bandH + 'px">' +
        '<span>' + esc(l[1]) + '</span></div>';
      items.forEach(function(it){
        pos[it.w.code] = {x:PADL + it.col * (W + GX), y:y + it.row * (H + GY)};
      });
      y += bandH + 10;
    });
    var totalW = PADL + (maxCol + 1) * (W + GX);
    var edges = "";
    nodes.forEach(function(w){
      (w.deps || []).forEach(function(c){
        var a = pos[c], b = pos[w.code];
        if(!a || !b) return;
        var on = crit[c] && crit[w.code];
        var x1 = a.x + W, y1 = a.y + H/2, x2 = b.x, y2 = b.y + H/2, mx = x1 + (x2 - x1)/2;
        edges += '<path d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + (x2 - 8) + ' ' + y2 + '" ' +
          'class="nedge' + (on ? " crit" : "") + '" marker-end="url(#ar' + (on ? "c" : "") + ')"></path>';
      });
    });
    var boxes = nodes.map(function(w){
      var p = pos[w.code], pr = wProgress(w);
      return '<div class="nnode s-' + w.st + (crit[w.code] ? " crit" : "") + '" data-open="work:' + w.id + '" tabindex="0" role="button" ' +
        'style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + W + 'px;height:' + H + 'px">' +
        '<span class="nc mono">' + esc(w.code) + (w.ms ? ' ◆' : "") + '</span>' +
        '<span class="nt">' + esc(w.title) + '</span>' +
        '<span class="nm"><span class="role">' + esc(w.who) + '</span>' +
        '<span class="mono">' + fmt(w.from) + "—" + fmt(w.to) + '</span></span>' +
        '<span class="nbar"><i style="width:' + pr.pct + '%"></i></span></div>';
    }).join("");
    return '<div class="card" style="padding:0;overflow:auto">' +
      '<div class="netwrap" style="width:' + (totalW + 24) + 'px;height:' + (y + 10) + 'px">' + bands +
      '<svg width="' + (totalW + 24) + '" height="' + (y + 10) + '" class="nsvg"><defs>' +
      '<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0 1 L9 5 L0 9 z" fill="var(--ink-3)"></path></marker>' +
      '<marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0 1 L9 5 L0 9 z" fill="var(--copper)"></path></marker></defs>' + edges + '</svg>' + boxes + '</div></div>';
  }

  /* таймлайн */
  function planTimeline(){
    var rows = planRows().filter(function(w){ return w.lvl <= 2; });
    if(!rows.length) return '<div class="listbox"><div class="empty">Под фильтр ничего не подошло.</div></div>';
    var min = null, max = null;
    state.plan.forEach(function(w){
      if(!min || w.from < min) min = w.from;
      if(!max || w.to > max) max = w.to;
    });
    var a = parse(min), b = parse(max);
    var T0 = new Date(a.getFullYear(), a.getMonth(), 1), T1 = new Date(b.getFullYear(), b.getMonth() + 1, 0);
    var span = dayDiff(T0, T1) + 1, months = [], cur = new Date(T0.getFullYear(), T0.getMonth(), 1);
    while(cur <= T1){
      var last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
      months.push({label:MONTHS[cur.getMonth()].slice(0,3) + " " + String(cur.getFullYear()).slice(2),
                   d:Math.min(last.getDate(), dayDiff(cur, T1) + 1)});
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    }
    var head = months.map(function(m){
      return '<div style="flex:' + m.d + ' 0 0">' + m.label + '</div>';
    }).join("");
    var todayR = dayDiff(T0, TODAY) / span, todayOn = todayR >= 0 && todayR <= 1;
    var body = rows.map(function(w){
      var sp = wSpan(w);
      var x = dayDiff(T0, parse(sp.from)) / span * 100, wd = (dayDiff(parse(sp.from), parse(sp.to)) + 1) / span * 100;
      var pr = wProgress(w);

        '<i style="width:' + pr.pct + '%"></i><b>' + esc(w.who || "") + '</b></span>' +
        (w.ms ? '<span class="tms" style="left:min(calc(' + (x + wd).toFixed(2) + '% - 7px),calc(100% - 15px))" title="Веха: ' + esc(w.title) + '">◆</span>' : "") +
        '</div></div>';
    }).join("");
    return '<div class="card" style="padding:0;overflow:hidden">' +
      '<div class="thead"><div class="tl">Работа</div><div class="tt">' + head + '</div></div>' +
      '<div class="tbody' + (todayOn ? " now" : "") + '" style="--today:' + todayR.toFixed(4) + '">' + body + '</div></div>';
  }

      '<button class="btn primary" type="button" data-new="work">Новая работа</button></div></div>';

    var stats = '<div class="stats">' +

        foot:late.length ? 'ближайшая: <b>' + esc(late[0].title) + '</b>' : "сроки плана выдерживаются" }) +
      (function(){
        var mss = all.filter(function(w){ return w.ms; });

        var next = ahead[0];
        return stat({ go:"plan", tone:"meet", label:"Вехи", total:mss.length,

                    : "этапов пройдено " + root.filter(function(w){ return wProgress(w).pct === 100; }).length });
      })() + '</div>';

    var filters = '<div class="toolbar">' +
      '<div class="filters" style="margin:0;flex:1">' +
      '<span class="dim" style="font-size:12.5px">Ответственный:</span>' +
      [["","Все"]].concat(Object.keys(WROLES).map(function(k){ return [k, k]; })).map(function(f){
        var n = f[0] ? all.filter(function(w){ return w.who === f[0]; }).length : all.length;
        if(!n) return "";
        return '<button class="fchip" type="button" data-pwho="' + f[0] + '" aria-pressed="' + (planWho === f[0]) + '" ' +
          'title="' + esc(WROLES[f[0]] || "Все блоки") + '">' + f[1] + '<span class="b">' + n + '</span></button>';
      }).join("") +
      '<span class="dim" style="font-size:12.5px;margin-left:10px">Статус:</span>' +
      [["","Любой"]].concat(Object.keys(WSTATUS).map(function(k){ return [k, WSTATUS[k].label]; })).map(function(f){
        var n = f[0] ? all.filter(function(w){ return w.st === f[0]; }).length : all.length;

  function hbar(rows, opts){
    var max = Math.max.apply(null, rows.map(function(r){ return r.total; })) || 1;
    var W = 460, rowH = opts.rowH || 30, padL = opts.padL, padR = 44, H = rows.length * rowH + 8;
    var barW = W - padL - padR;
    var bars = rows.map(function(r, i){
      var y = i * rowH + 4, x = padL, out = "";
      r.parts.forEach(function(seg){
        if(!seg.v) return;
        var w = seg.v / max * barW;
        out += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + Math.max(w - 2, 1.5).toFixed(1) + '" height="15" rx="4" fill="' + seg.color + '"' +
          ' data-tip="' + esc(r.label + " · " + seg.name + ": " + seg.v) + '"></rect>';
        x += w;
      });
      out += '<text x="' + (padL - 10) + '" y="' + (y + 11.5) + '" text-anchor="end" font-size="12" fill="var(--ink-2)">' + esc(r.label) + '</text>';
      out += '<text x="' + (x + 7).toFixed(1) + '" y="' + (y + 11.5) + '" font-size="12" fill="var(--ink-3)">' + r.total + '</text>';
      return out;
    }).join("");
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="' + esc(opts.alt) + '">' + bars + '</svg>';
  }

  function wireTips(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-tip]"), function(el){
      el.addEventListener("mouseenter", function(e){
        if(tipEl) tipEl.remove();
        tipEl = document.createElement("div");
        tipEl.className = "tip";
        tipEl.textContent = el.getAttribute("data-tip");
        document.body.appendChild(tipEl);
        move(e);
      });
      el.addEventListener("mousemove", move);
      el.addEventListener("mouseleave", function(){ if(tipEl){ tipEl.remove(); tipEl = null; } });
      function move(e){
        if(!tipEl) return;
        tipEl.style.left = Math.min(e.clientX + 12, window.innerWidth - tipEl.offsetWidth - 8) + "px";

      }
    });

  function openSheet(html, onMount){
    closeSheet();
    var scrim = document.createElement("div"); scrim.className = "scrim"; scrim.id = "scrim";
    var sh = document.createElement("aside"); sh.className = "sheet"; sh.id = "sheet";
    sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true");
    sh.innerHTML = html;
    document.body.appendChild(scrim); document.body.appendChild(sh);
    scrim.addEventListener("click", closeSheet);
    document.addEventListener("keydown", escSheet);
    var c = sh.querySelector("[data-close]");
    if(c) c.addEventListener("click", closeSheet);
    if(onMount) onMount(sh);
    var f = sh.querySelector("input,select,textarea,button");
    if(f) f.focus();
  }
